<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savaş Kaydı - Değerleme Matrisi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --green: #33ff33; 
            --dim-green: #1a881a;
            --bg: #050505;
            --panel-bg: rgba(0, 20, 0, 0.85);
            --border: 2px solid var(--green);
        }

        body {
            background-color: var(--bg);
            color: var(--green);
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            text-shadow: 0 0 3px var(--dim-green);
        }

        /* CRT Overlay */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            z-index: 999;
        }

        .main-interface {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        @media (max-width: 800px) {
            .main-interface { grid-template-columns: 1fr; }
        }

        /* Panels */
        .panel {
            border: var(--border);
            background: var(--panel-bg);
            padding: 20px;
            box-shadow: 0 0 20px var(--dim-green) inset;
            position: relative;
        }

        h2 {
            margin-top: 0;
            border-bottom: 1px dashed var(--green);
            padding-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 1rem;
            color: var(--dim-green);
            margin-bottom: 3px;
        }

        select, input[type="text"], input[type="number"] {
            background: #000;
            border: 1px solid var(--green);
            color: var(--green);
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            padding: 5px;
            width: 100%;
            box-sizing: border-box;
        }

        select:focus, input:focus {
            outline: none;
            box-shadow: 0 0 10px var(--green);
        }

        /* Scrolling Checkbox Lists for Multi-Select */
        .scroll-list {
            height: 120px;
            overflow-y: auto;
            border: 1px solid var(--green);
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
        }

        /* Scrollbar Styling */
        .scroll-list::-webkit-scrollbar { width: 8px; }
        .scroll-list::-webkit-scrollbar-track { background: #000; }
        .scroll-list::-webkit-scrollbar-thumb { background: var(--dim-green); }

        .list-item {
            display: flex;
            align-items: center;
            padding: 2px 0;
            font-size: 1rem;
            border-bottom: 1px solid rgba(51, 255, 51, 0.1);
        }
        .list-item:hover { background: rgba(51, 255, 51, 0.1); }
        .list-item input { width: auto; margin-right: 8px; cursor: pointer; }
        .list-item span { cursor: pointer; width: 100%; display: flex; justify-content: space-between; padding-right: 5px; }
        .item-special { font-size: 0.85rem; color: #698c69; font-style: italic; text-align: right;}

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box { text-align: center; }
        .stat-note { font-size: 0.8rem; color: #888; }
        
        /* Checkboxes Group (Tags) */
        .checkbox-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .checkbox-group label {
            display: flex; align-items: center; cursor: pointer; color: var(--green);
        }
        .checkbox-group input { width: 15px; height: 15px; appearance: none; border: 1px solid var(--green); margin-right: 8px; position: relative; }
        .checkbox-group input:checked::after { content: 'X'; position: absolute; top: -3px; left: 2px; font-size: 14px; color: var(--green); }

        /* Data Card (Right Side) */
        .data-card {
            border: 2px solid var(--green);
            padding: 15px;
            background: #000;
            margin-top: 20px;
            position: sticky;
            top: 20px;
        }

        .card-header {
            display: flex; justify-content: space-between; border-bottom: 2px solid var(--green); padding-bottom: 5px; margin-bottom: 10px; font-size: 1.4rem; font-weight: bold;
        }

        .stat-row {
            display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; border-bottom: 1px solid var(--green); margin-bottom: 10px; padding-bottom: 5px;
        }

        .calculation-breakdown {
            font-size: 0.9rem; color: var(--dim-green); border-top: 1px dotted var(--dim-green); margin-top: 10px; padding-top: 5px;
        }

        .total-points {
            font-size: 2rem; text-align: right; margin-top: 20px; border-top: 1px double var(--green); padding-top: 10px;
        }

        .blink { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .back-btn {
            position: fixed; top: 20px; left: 20px; border: 1px solid var(--green); padding: 5px 10px; text-decoration: none; color: var(--green); background: #000; z-index: 1000;
        }
        .back-btn:hover { background: var(--green); color: #000; }

    </style>
</head>
<body>

    function validatePsych(el) {
        if(el.value > 6) el.value = 6;
        if(el.value < 0) el.value = 0;
        calculate();
    }

    function renderList(containerId, items, isArmour = false) {
        const container = document.getElementById(containerId);
        container.innerHTML = ""; 
        
        if(!items || items.length === 0) {
            container.innerHTML = "<div style='color:#555; padding:5px;'>-- Mevcut Değil --</div>";
            return;
        }

        items.forEach((item, index) => {
            const div = document.createElement("div");
            div.className = "list-item";
            
            const chk = document.createElement("input");
            chk.type = "checkbox";
            chk.value = item.p;
            chk.dataset.name = item.n;
            chk.dataset.special = item.s || ""; 
            chk.dataset.dv = item.dv || 0;
            chk.id = `${containerId}_${index}`;
            
            if (isArmour && item.suit) {
                chk.classList.add('suit-armor');
                chk.onclick = function() {
                    if (this.checked) {
                        const allSuits = container.querySelectorAll('.suit-armor');
                        allSuits.forEach(s => {
                            if(s !== this) s.checked = false;
                        });
                    }
                    calculate();
                };
            } else {
                chk.onclick = calculate;
            }

            const label = document.createElement("span");
            label.onclick = function() { chk.click(); };
            label.innerHTML = `${item.n} [${item.p}] <span class="item-special">${item.s}</span>`;

            div.appendChild(chk);
            div.appendChild(label);
            container.appendChild(div);
        });
    }

    function updateArmory() {
        const faction = document.getElementById('factionSelect').value;
        const data = ARMORY[faction];

        renderList('listArmour', data.armour, true); 
        
        let grenadesList = (data.grenades && data.grenades.length > 0) ? data.grenades : [];
        if(faction === 'human' || faction === 'chitinsan') grenadesList = ARMORY['human'].grenades;
        renderList('listGear', grenadesList);

        let psychoList = (data.psychos && data.psychos.length > 0) ? data.psychos : [];
        if(faction === 'human' || faction === 'chitinsan') psychoList = ARMORY['human'].psychos;
        renderList('listExtra', psychoList);

        document.getElementById('dispFaction').innerText = faction.toUpperCase();
        
        calculate();
    }

    function getCheckedItems(containerId) {
        let total = 0;
        let totalDv = 0;
        let items = [];
        const container = document.getElementById(containerId);
        const checks = container.querySelectorAll('input[type="checkbox"]:checked');
        
        checks.forEach(chk => {
            total += parseFloat(chk.value);
            totalDv += parseInt(chk.dataset.dv || 0);

            let nameStr = chk.dataset.name;
            if(chk.dataset.special) {
                // Shorten text for card
                let s = chk.dataset.special;
                nameStr += ` (${s})`;
            }
            items.push(nameStr);
        });
        
        return { cost: total, names: items, dv: totalDv };
    }

    function calculate() {
        const userStats = {
            MOV: parseFloat(document.getElementById('statMOV').value) || 0,
            MSL: parseFloat(document.getElementById('statMSL').value) || 0,
            MLE: parseFloat(document.getElementById('statMLE').value) || 0,
            STR: parseFloat(document.getElementById('statSTR').value) || 0,
            DEF: parseFloat(document.getElementById('statDEF').value) || 0,
            MRL: parseFloat(document.getElementById('statMRL').value) || 0
        };

        let statCost = 0;
        statCost += (userStats.MOV - BASE_STATS.MOV) * STAT_STEP_COSTS.MOV;
        statCost += (userStats.MLE - BASE_STATS.MLE) * STAT_STEP_COSTS.MLE;
        statCost += (userStats.STR - BASE_STATS.STR) * STAT_STEP_COSTS.STR;
        statCost += (userStats.DEF - BASE_STATS.DEF) * STAT_STEP_COSTS.DEF;
        statCost += (userStats.MRL - BASE_STATS.MRL) * STAT_STEP_COSTS.MRL;
        // MSL Logic: Lower is better (costlier)
        const mslImprovement = BASE_STATS.MSL - userStats.MSL;
        statCost += mslImprovement * STAT_STEP_COSTS.MSL;

        let tagCost = 0;
        let skillsText = [];

        const aggroLvl = parseInt(document.getElementById('skillAggro').value) || 0;
        if(aggroLvl > 0) {
            tagCost += aggroLvl * 5;
            skillsText.push(`SALDIRGAN(${aggroLvl+1})`);
        }

        const toughLvl = parseInt(document.getElementById('skillTough').value) || 0;
        if(toughLvl > 0) {
            tagCost += toughLvl * 4;
            skillsText.push(`ÇETİN(${toughLvl+1})`);
        }

        let psychLvl = parseInt(document.getElementById('skillPsych').value) || 0;
        if(psychLvl > 6) psychLvl = 6;
        if(psychLvl > 0) {
            tagCost += PSYCH_TABLE[psychLvl];
            skillsText.push(`PSİ-${psychLvl}`);
        }

        if(document.getElementById('checkMounted').checked) {
            tagCost += 5;
            skillsText.push("ATLI");
        }
        if(document.getElementById('checkScout').checked) {
            tagCost += 3;
            skillsText.push("İZCİ");
        }
        if(document.getElementById('checkLeaper').checked) {
            tagCost += 2;
            skillsText.push("SIÇRAK");
        }
        if(document.getElementById('checkPanoptic').checked) {
            tagCost += 3;
            skillsText.push("PANOPTIC");
        }
        if(document.getElementById('checkBehemoth').checked) {
            tagCost += 5;
            skillsText.push("DEVASA");
        }

        let rawProfile = BASE_COST + statCost + tagCost;
        if(rawProfile < 1) rawProfile = 1;

        let multiplier = 1;
        if(rawProfile > 10) {
            if(rawProfile <= 15) multiplier = 1.5;
            else if(rawProfile <= 20) multiplier = 2;
            else if(rawProfile <= 30) multiplier = 3;
            else if(rawProfile <= 40) multiplier = 4;
            else if(rawProfile <= 50) multiplier = 5;
            else {
                multiplier = 5 + Math.ceil((rawProfile - 50) / 10);
            }
        }

        let multipliedProfile = rawProfile * multiplier;

        const rPrimary = getCheckedItems('listPrimary');
        const rSecondary = getCheckedItems('listSecondary');
        const rArmour = getCheckedItems('listArmour');
        const rGear = getCheckedItems('listGear');
        const rExtra = getCheckedItems('listExtra');

        let equipCost = rPrimary.cost + rSecondary.cost + rArmour.cost + rGear.cost + rExtra.cost;
        const totalFinal = multipliedProfile + equipCost;

        // Display
        document.getElementById('dispName').innerText = document.getElementById('modelName').value || "ERAT-01";
        
        document.getElementById('dMOV').innerText = userStats.MOV;
        document.getElementById('dMSL').innerText = userStats.MSL + "+";
        document.getElementById('dMLE').innerText = userStats.MLE;
        document.getElementById('dSTR').innerText = userStats.STR;
        
        let defDisplay = userStats.DEF;
        if(rArmour.dv > 0) {
            defDisplay += ` (+${rArmour.dv})`;
        }
        document.getElementById('dDEF').innerText = defDisplay;

        document.getElementById('dMRL').innerText = userStats.MRL;

        let allWeapons = [...rPrimary.names, ...rSecondary.names];
        document.getElementById('dispWeapons').innerText = "SİLAHLAR: " + (allWeapons.length ? allWeapons.join(", ") : "-");

        document.getElementById('dispArmour').innerText = "ZIRH: " + (rArmour.names.length ? rArmour.names.join(", ") : "-");

        let allGear = [...rGear.names, ...rExtra.names];
        document.getElementById('dispGear').innerText = "TEÇHİZAT: " + (allGear.length ? allGear.join(", ") : "-");

        document.getElementById('dispSkills').innerText = skillsText.length ? skillsText.join(", ") : "-";

        document.getElementById('debugCalc').innerHTML = 
            `Taban: ${rawProfile.toFixed(2)} x ${multiplier} (Çarpan) = ${multipliedProfile.toFixed(2)}<br>` +
            `+ Donanım: ${equipCost}`;

        document.getElementById('finalPoints').innerText = +totalFinal.toFixed(2);
    }

    // Init
    updateArmory();
</script>

</body>
</html>
